<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Talani Adventures & Group ya Ile Kitu</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1f2937;
      --border: #283548;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #10b981;
      --gold: #f59e0b;
      --ring: linear-gradient(45deg, #f59e0b, #10b981, #38bdf8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); max-width: 680px; margin: 0 auto; padding-bottom: 60px; }
    .hidden { display: none !important; }

    /* Top Nav */
    header {
      position: sticky; top: 0; z-index: 20; background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand-title { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.3px; }
    .brand-sub { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
    .studio-link {
      font-size: 0.74rem; color: var(--muted); text-decoration: none;
      border: 1px solid var(--border); padding: 5px 10px; border-radius: 99px;
    }

    /* Instagram-Style Stories Bar */
    .stories-bar {
      display: flex; gap: 14px; overflow-x: auto; padding: 14px 16px;
      border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; flex-shrink: 0; width: 68px; }
    .story-ring {
      width: 62px; height: 62px; border-radius: 50%; padding: 2.5px;
      background: var(--ring); display: flex; align-items: center; justify-content: center;
    }
    .story-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--bg); }
    .story-label { font-size: 0.7rem; color: var(--text); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    /* Section Headers & Brand Filter Pills */
    .sec-head { padding: 16px 16px 8px; display: flex; justify-content: space-between; align-items: center; }
    .sec-head h2 { font-size: 1rem; font-weight: 700; }
    .pills { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; }
    .pill {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .pill.active { background: var(--accent); color: #052e16; border-color: var(--accent); }

    /* Trip Profile Cards ("Accounts") */
    .trip-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      margin: 0 16px 16px; overflow: hidden;
    }
    .trip-cover { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--surface-2); display: block; }
    .trip-body { padding: 14px; }
    .trip-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .trip-title { font-size: 1.05rem; font-weight: 800; }
    .badge { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
    .badge.ok { background: rgba(16, 185, 129, 0.16); color: var(--accent); }
    .badge.warn { background: rgba(245, 158, 11, 0.16); color: var(--gold); }
    .trip-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
    .trip-bio { font-size: 0.84rem; line-height: 1.45; color: #e5e7eb; margin-bottom: 10px; white-space: pre-line; }
    .tier-box {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; font-size: 0.76rem; color: var(--gold); margin-bottom: 12px;
    }
    .trip-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .price-tag { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .price-sub { font-size: 0.72rem; color: var(--muted); display: block; }
    .btn-book {
      background: var(--accent); color: #052e16; font-weight: 800; font-size: 0.84rem;
      padding: 10px 16px; border-radius: 10px; text-decoration: none; border: none; cursor: pointer;
    }

    /* D-Day Posts & Reels Grid (Instagram Profile Grid) */
    .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 16px; }
    .ig-tile { position: relative; aspect-ratio: 1 / 1; background: var(--surface-2); overflow: hidden; cursor: pointer; }
    .ig-tile img, .ig-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reel-icon {
      position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, 0.65);
      color: #fff; font-size: 0.68rem; padding: 2px 6px; border-radius: 6px; font-weight: 700;
    }

    /* Fullscreen Modal (Story & Post Viewer) */
    .modal {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.94);
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-inner { max-width: 460px; width: 100%; text-align: center; }
    .modal-media { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; margin-bottom: 10px; }
    .modal-caption { font-size: 0.88rem; margin-bottom: 12px; color: #f3f4f6; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-outline {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 10px; font-size: 0.8rem; text-decoration: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title">Talani Adventures</div>
      <div class="brand-sub">Group ya Ile Kitu • Curated Expeditions</div>
    </div>
    <a href="./studio.html" class="studio-link">Creator Studio</a>
  </header>

  <!-- STORIES BAR -->
  <div class="stories-bar" id="stories-bar"></div>

  <!-- BRAND FILTER -->
  <div class="sec-head">
    <h2>Upcoming Expeditions</h2>
    <span id="live-status" class="brand-sub">● Live</span>
  </div>
  <div class="pills" id="brand-pills">
    <button class="pill active" data-brand="ALL">All Experiences</button>
    <button class="pill" data-brand="Group ya Ile Kitu">Group ya Ile Kitu</button>
    <button class="pill" data-brand="Talani Premium Tours">Talani Premium</button>
    <button class="pill" data-brand="Adamanti Hospitality">Adamanti Stays</button>
  </div>

  <!-- UPCOMING TRIPS FEED -->
  <div id="trips-feed"></div>

  <!-- D-DAY REELS & PHOTO GRID -->
  <div class="sec-head">
    <h2>D-Day Memories & Reels</h2>
    <span style="font-size:0.74rem; color:var(--muted);">Tap for HD</span>
  </div>
  <div class="ig-grid" id="posts-grid"></div>

  <!-- LIGHTBOX MODAL (STORIES & POSTS) -->
  <div id="viewer-modal" class="modal hidden">
    <div class="modal-inner">
      <div id="modal-media-wrap"></div>
      <div id="modal-caption" class="modal-caption"></div>
      <div class="modal-actions">
        <a id="modal-hd-link" href="#" target="_blank" download class="btn-outline hidden">⬇ Download Original HD</a>
        <button id="modal-close-btn" class="btn-outline">✕ Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDhdiJxS7bI4BX0E9ObXGjMA4Y95sXZftc",
      authDomain: "talani-adventures.firebaseapp.com",
      projectId: "talani-adventures",
      storageBucket: "talani-adventures.firebasestorage.app",
      messagingSenderId: "698912000783",
      appId: "1:698912000783:web:ab04f85cb956c994558c7a",
      measurementId: "G-X2HVRDMRDM"
    };

    let tripsData = [
      {
        id: "demo_gatamaiyu",
        brand: "Group ya Ile Kitu",
        title: "Gatamaiyu Forest Waterfall Hike",
        date: "2026-12-05",
        price: 3000,
        deposit: 1800,
        slotsTotal: 22,
        slotsLeft: 9,
        coverUrl: "https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=900&q=80",
        bio: "Lush bamboo trails, river crossings & waterfall picnic in Kiambu.\nIncludes: Overland transport from Nairobi CBD, KFS entry, armed rangers, guides, trail snacks & pro photography.",
        groupDiscountNote: "Group Discounts: 5% off (3–5 pax) • 7% off (5–7 pax) • 10% off (7–10 pax)",
        formUrl: "https://docs.google.com/forms/"
      }
    ];
    let storiesData = [
      {
        id: "st_1",
        label: "Gatamaiyu",
        caption: "Only 9 slots left for Dec 5th! Tap Reserve Slot to lock yours with KSh 1,800 deposit.",
        mediaUrl: "https://images.unsplash.com/photo-1501555088652-021faa106b9b?auto=format&fit=crop&w=700&q=80"
      }
    ];
    let postsData = [
      {
        id: "pt_1",
        type: "image",
        webUrl: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80",
        rawUrl: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=95",
        caption: "Summit squad energy from our last ridge expedition!"
      }
    ];

    let activeBrand = "ALL";
    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function renderStories() {
      document.getElementById("stories-bar").innerHTML = storiesData.map((s, i) => `
        <div class="story-item" data-idx="${i}">
          <div class="story-ring"><img src="${esc(s.mediaUrl)}" alt="${esc(s.label)}" loading="lazy" /></div>
          <span class="story-label">${esc(s.label || "Update")}</span>
        </div>`).join("");

      document.querySelectorAll(".story-item").forEach((el) => {
        el.addEventListener("click", () => {
          const s = storiesData[Number(el.dataset.idx)];
          openModal("image", s.mediaUrl, null, s.caption);
        });
      });
    }

    function renderTrips() {
      const list = tripsData.filter((t) => activeBrand === "ALL" || t.brand === activeBrand);
      document.getElementById("trips-feed").innerHTML = list.map((t) => `
        <article class="trip-card">
          ${t.coverUrl ? `<img class="trip-cover" src="${esc(t.coverUrl)}" alt="${esc(t.title)}" loading="lazy" />` : ""}
          <div class="trip-body">
            <div class="trip-top">
              <h3 class="trip-title">${esc(t.title)}</h3>
              <span class="badge ${t.slotsLeft > 4 ? "ok" : "warn"}">${t.slotsLeft} / ${t.slotsTotal} slots left</span>
            </div>
            <div class="trip-meta">${esc(t.brand)} • 📅 ${esc(t.date)}</div>
            <p class="trip-bio">${esc(t.bio)}</p>
            ${t.groupDiscountNote ? `<div class="tier-box">🎟 ${esc(t.groupDiscountNote)}</div>` : ""}
            <div class="trip-footer">
              <div>
                <span class="price-tag">KSh ${Number(t.price || 0).toLocaleString()}</span>
                <span class="price-sub">Deposit: KSh ${Number(t.deposit || 0).toLocaleString()}</span>
              </div>
              <a class="btn-book" href="${esc(t.formUrl || "#")}" target="_blank" rel="noopener">Reserve Slot →</a>
            </div>
          </div>
        </article>`).join("") || `<p style="padding:16px; color:var(--muted);">No upcoming trips listed under this brand yet.</p>`;
    }

    function renderPosts() {
      document.getElementById("posts-grid").innerHTML = postsData.map((p, i) => `
        <div class="ig-tile" data-idx="${i}">
          ${p.type === "video"
            ? `<video src="${esc(p.webUrl)}" muted playsinline preload="metadata"></video><span class="reel-icon">▶ REEL</span>`
            : `<img src="${esc(p.webUrl)}" alt="${esc(p.caption)}" loading="lazy" />`}
        </div>`).join("");

      document.querySelectorAll(".ig-tile").forEach((el) => {
        el.addEventListener("click", () => {
          const p = postsData[Number(el.dataset.idx)];
          openModal(p.type, p.webUrl, p.rawUrl, p.caption);
        });
      });
    }

    function openModal(type, webUrl, rawUrl, caption) {
      const wrap = document.getElementById("modal-media-wrap");
      wrap.innerHTML = type === "video"
        ? `<video class="modal-media" src="${esc(webUrl)}" controls autoplay playsinline></video>`
        : `<img class="modal-media" src="${esc(webUrl)}" alt="" />`;
      document.getElementById("modal-caption").textContent = caption || "";
      const hd = document.getElementById("modal-hd-link");
      if (rawUrl) { hd.href = rawUrl; hd.classList.remove("hidden"); }
      else { hd.classList.add("hidden"); }
      document.getElementById("viewer-modal").classList.remove("hidden");
    }

    document.getElementById("modal-close-btn").addEventListener("click", () => {
      document.getElementById("modal-media-wrap").innerHTML = "";
      document.getElementById("viewer-modal").classList.add("hidden");
    });

    document.querySelectorAll("#brand-pills .pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#brand-pills .pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeBrand = btn.dataset.brand;
        renderTrips();
      });
    });

    renderStories();
    renderTrips();
    renderPosts();

    const app = initializeApp(FIREBASE_CONFIG);
    const db = getFirestore(app);

    onSnapshot(query(collection(db, "trips"), orderBy("date", "asc")), (snap) => {
      if (!snap.empty) {
        tripsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderTrips();
      }
    });
    onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc")), (snap) => {
      if (!snap.empty) {
        storiesData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderStories();
      }
    });
    onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
      if (!snap.empty) {
        postsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderPosts();
      }
    });
  </script>
</body>
</html>
